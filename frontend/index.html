<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>💸 Expense Tracker</title>
    <meta name="description" content="Track your daily expenses — MERN stack project" />
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!--
      IMPORTANT: This single <div id="root"> is where React injects your entire app.
      React is a "Single Page Application" (SPA) — it doesn't load new HTML pages.
      Instead, JavaScript manipulates this div to show different "pages" (components).
    -->
    <div id="root"></div>

    <!--
      This script tag loads our built React app.
      Vite replaces "type=module" with the actual bundled file in production.
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
